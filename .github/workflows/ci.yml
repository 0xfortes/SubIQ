name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      # Download the repository code
      - uses: actions/checkout@v4

      # Install pnpm first.
      # Version comes from package.json "packageManager": pnpm@11.13.1.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # Install the Node version defined in .nvmrc (Node 22).
      # pnpm must already exist before enabling pnpm cache.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Install exact dependency versions from pnpm-lock.yaml.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Verify TypeScript correctness.
      - name: Typecheck
        run: pnpm typecheck

      # Verify code quality and style rules.
      - name: Lint
        run: pnpm lint

      # Run automated tests.
      - name: Test
        run: pnpm test

      # Verify the application can compile for production.
      # These are dummy build-only values, not real secrets.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/subiq_ci
          AUTH_SECRET: ci-build-only-dummy-auth-secret-0000000000
          CRON_SECRET: ci-build-only-dummy-cron-secret-000000
